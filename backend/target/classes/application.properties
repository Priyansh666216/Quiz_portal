# ===========================
# Application Configuration
# ===========================
spring.application.name=online-quiz-app
server.port=8080

# ===========================
# MySQL Database Configuration
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/quiz_db2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================
# JWT Configuration
# ===========================
app.jwt.secret=myVerySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong1234567890
app.jwt.expiration=86400000

# ===========================
# CORS
# ===========================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500

